#
# Every package of the system, built from the umbrella's pins for each line in
# ci/lines.json, install-tested in a clean container (build-packages.yml), and
# published as one signed apt archive on a3-system's GitHub Pages.
name: Packages

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read

env:
  # A debconf prompt (tzdata and the like) would stall a container job for hours.
  DEBIAN_FRONTEND: noninteractive

defaults:
  run:
    # Named explicitly, GitHub runs bash -eo pipefail: a failing script in
    # front of a pipe fails the step (the default is bash -e only).
    shell: bash

jobs:
  packages:
    uses: ./.github/workflows/build-packages.yml

  publish:
    needs: packages
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    container: debian:testing
    permissions:
      contents: write
    # Two pushes in a row publish one after the other, never over each other.
    concurrency:
      group: packages-publish
      cancel-in-progress: false
    steps:
      - name: Checkout tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates python3 dpkg-dev gnupg

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Download
        uses: actions/download-artifact@v4
        with:
          pattern: debs-*
          path: debs

      - name: Index both lines
        run: |
          python3 ci/matrix.py --suites | while read -r suite arch; do
            python3 ci/archive.py index public "$suite" "$arch" "debs/debs-$suite"/*.deb
          done

      - name: Import the signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          mkdir -m 700 "$RUNNER_TEMP/gnupg"
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --homedir "$RUNNER_TEMP/gnupg" --batch --import

      # A key that differs from the committed one would sign an archive no
      # installed machine trusts: stop before anything is signed.
      - name: The key matches the committed one
        run: python3 ci/archive.py key-matches installer/keys/a3-audio-archive.asc --gpg-home "$RUNNER_TEMP/gnupg"

      - name: Sign both lines
        run: |
          for release in public/dists/*/Release; do
            python3 ci/archive.py sign "$release" --gpg-home "$RUNNER_TEMP/gnupg"
          done

      - name: Public key and raw files
        run: |
          cp installer/keys/a3-audio-archive.asc public/KEY.gpg
          touch public/.nojekyll

      # force_orphan: the archive keeps no history, or every run would add its
      # debs to gh-pages for good.
      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          force_orphan: true
